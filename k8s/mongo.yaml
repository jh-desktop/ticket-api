# 로컬 클러스터용 MongoDB. (운영은 보통 관리형 DB 나 StatefulSet 을 쓴다)
---
# 디스크 요청. Pod 이 죽어도 데이터가 남게 한다. kind 에는 기본 StorageClass 가 있어 자동으로 할당된다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
# Service: Pod 에 붙는 고정된 이름/주소. 앱은 "mongo:27017" 로 접속한다.
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector: { app: mongo }
  ports:
    - port: 27017
      targetPort: 27017
