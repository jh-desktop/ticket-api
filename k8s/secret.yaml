# 비밀 설정. 실제 운영에서는 이 파일을 git 에 올리지 않고 (또는 Sealed Secrets / 외부 Vault 로)
# 클러스터에 직접 만든다:  kubectl create secret generic ticket-api-secret --from-literal=JWT_SECRET=...
# 여기 값은 로컬 학습용 더미다.
apiVersion: v1
kind: Secret
metadata:
  name: ticket-api-secret
type: Opaque
stringData:
  JWT_SECRET: "k8s-local-only-secret-0123456789abcdef0123456789abcdef"
