# 로컬 개발용.
#   DB 만:        docker compose up -d mongo
#   앱 + DB:      docker compose up -d --build
#   끄기:         docker compose down          (데이터는 남음)
#   초기화:       docker compose down -v       (데이터까지 삭제)
services:
  mongo:
    image: mongo:7
    container_name: ticket-api-mongo
    ports:
      - "27017:27017"          # 내 PC 27017 → 컨테이너 27017 (Compass, 로컬 uvicorn 용)
    volumes:
      - mongo_data:/data/db    # 컨테이너를 지워도 데이터 유지

  app:
    build: .
    image: ticket-api:local   # kind 클러스터에도 같은 이름으로 올린다 (kind load docker-image)
    container_name: ticket-api-app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      # 컨테이너끼리는 서비스 이름(mongo)이 호스트명이다. localhost 는 "앱 컨테이너 자기 자신" 이라 안 된다.
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: ticket_api
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdef0123456789
      COOKIE_SECURE: "false"
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo_data:
