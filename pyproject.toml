[project]
name = "ticket-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ticket-api = "ticket_api:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
