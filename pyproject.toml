[project]
name = "ticket-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ticket-api = "ticket_api:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"                       # async def 테스트에 데코레이터 없이도 실행
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`",   # httpx2 권장 경고 (5주차 미해결)
]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"     # 회사와 동일. TS 의 strict 와 비슷한 체감
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
